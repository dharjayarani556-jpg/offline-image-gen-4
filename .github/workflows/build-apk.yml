name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "No gradlew found, will use gradle directly"
          fi

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APK
        run: |
          # Use gradle wrapper if exists, otherwise install and use gradle
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            # Install gradle and generate wrapper then build
            sudo apt-get update -qq
            sudo apt-get install -y -qq wget unzip
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip
            export PATH=$PATH:$(pwd)/gradle-8.7/bin
            gradle wrapper --gradle-version 8.7
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DARK-JISAN-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release (only on main push)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DARK JISAN APK v1.0.${{ github.run_number }}
          body: |
            Offline Image Generation App - DARK JISAN
            
            Download the APK below and install on your Android phone.
            
            **Note:** You still need to select a MediaPipe-compatible model folder (like sd15_bing) after installing.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
